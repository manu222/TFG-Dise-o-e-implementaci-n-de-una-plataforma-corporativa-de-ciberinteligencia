  connector-abuseipdb:
    image: opencti/connector-abuseipdb:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${ABUSEIPDB_USER_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ABUSEIPDB_TOKEN}
      - CONNECTOR_TYPE=INTERNAL_ENRICHMENT
      - CONNECTOR_NAME=AbuseIPDB
      - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr
      - CONNECTOR_AUTO=true
      - CONNECTOR_LOG_LEVEL=info
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - ABUSEIPDB_SCORE_THRESHOLD=50 # Solo reporta si la confianza de abuso es mayor al 50%
    restart: always
    networks:
      - opencti_net
  connector-shodan:
    image: opencti/connector-shodan:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${SHODAN_USER_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_SHODAN_TOKEN}
      - CONNECTOR_TYPE=INTERNAL_ENRICHMENT
      - CONNECTOR_NAME=Shodan
      - CONNECTOR_SCOPE=IPv4-Addr,IPv6-Addr,Domain-Name
      - CONNECTOR_AUTO=false # true = Enriquece todo lo que entre automáticante, lo dejo false no se limites de api
      - CONNECTOR_LOG_LEVEL=error
      - SHODAN_TOKEN=${SHODAN_API_KEY}
      - SHODAN_MAX_RETRIES=3
    restart: always
    networks:
      - opencti_net


