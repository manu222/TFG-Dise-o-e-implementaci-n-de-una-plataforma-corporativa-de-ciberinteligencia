    image: opencti/connector-malwarebazaar:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${MALWAREBAZAAR_USER_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MALWAREBAZAAR_TOKEN}
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=MalwareBazaar
      - CONNECTOR_SCOPE=StixFile,Artifact
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=PT4H # Cada 4 horas
      - MALWAREBAZAAR_API_KEY=${ABUSECH_API_KEY}
      - MALWAREBAZAAR_INTERVAL=1
    restart: always
    networks:
      - opencti_net
