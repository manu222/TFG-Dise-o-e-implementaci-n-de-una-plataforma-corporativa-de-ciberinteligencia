  connector-stream:
    build: ../custom_connectors/stream_exporter
    image: opencti/connector-stream:latest
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_STREAM_TOKEN}
      - CONNECTOR_TYPE=STREAM
      - CONNECTOR_NAME=Real-time File Exporter
      - STREAM_ID=${STREAM_ID}
      - LOG_LEVEL=info
    restart: always
    networks:
      - opencti_net
    volumes:
      - ./export_logs:/var/log
