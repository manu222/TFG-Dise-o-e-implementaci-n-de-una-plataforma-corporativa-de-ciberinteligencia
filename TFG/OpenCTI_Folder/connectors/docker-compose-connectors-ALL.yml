  connector-cisa:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${CISA_USER_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_CISA_ID}
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=CISA Known Exploited Vulnerabilities
      - CONNECTOR_SCOPE=identity,vulnerability,course-of-action,software
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=P1D # Se ejecuta solo 1 vez al día
    restart: always
    networks:
      - opencti_net
##############################################################
