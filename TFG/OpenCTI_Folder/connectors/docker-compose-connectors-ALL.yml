  connector-threatfox:
    image: opencti/connector-threatfox:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${THREATFOX_USER_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_THREATFOX_TOKEN}
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Abuse.ch ThreatFox
      - CONNECTOR_SCOPE=ipv4-addr,ipv6-addr,domain,url,file,malware,indicator
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_DURATION_PERIOD=P1D
      - THREATFOX_INTERVAL=1
      - THREATFOX_IMPORT_WITH_TAGS=true
    restart: always
    networks:
      - opencti_net
