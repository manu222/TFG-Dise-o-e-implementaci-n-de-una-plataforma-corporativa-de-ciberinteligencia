  connector-urlhaus:
    image: opencti/connector-urlhaus:6.9.22
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${URLHAUS_USER_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_URLHAUS_TOKEN}
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Abuse.ch URLhaus
      - CONNECTOR_SCOPE=url,domain,hostname
      - CONNECTOR_LOG_LEVEL=info
      - CONNECTOR_RUN_AND_TERMINATE=false
      - CONNECTOR_DURATION_PERIOD=PT4H # Se ejecuta cada 4 horas
      - URLHAUS_INTERVAL=4 # Fallback para la versión antigua
      - URLHAUS_IMPORT_TAGS=true
      - URLHAUS_CSV_URL=https://urlhaus.abuse.ch/downloads/csv_recent/
    restart: always
    networks:
      - opencti_net
